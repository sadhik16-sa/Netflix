<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation bar with logo -->
  <header class="navbar">
    <img src="netflix.jpg" alt="Netflix Logo" class="logo">
    <nav>
      <a href="#">Home</a>
      <a href="#">Movies</a>
      <a href="#">TV Shows</a>
      <a href="#">My List</a>
    </nav>
  </header>

  <!-- Banner section -->
  <section class="banner">
    <h2>Featured Movie</h2>
    <p>Watch the latest blockbuster now!</p>
    <button>Play</button>
    <button>More Info</button>
  </section>

  <!-- Movie row -->
  <section class="row">
    <h3>Popular on Netflix</h3>
    <div class="movies">
      <img src="poster1.jpg" alt="Movie 1">
      <img src="poster2.jpg" alt="Movie 2">
      <img src="poster3.jpg" alt="Movie 3">
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>Netflix Clone Project © 2026</p>
  </footer>
</body>
</html>
